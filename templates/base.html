<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}InkMoments{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="nav">
    <div class="nav-inner">
        <a href="/" class="nav-logo">📷 <span>InkMoments</span></a>
        <div class="nav-links">
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">今日</a>
            <a href="/gallery" class="nav-link {% if request.path == '/gallery' %}active{% endif %}">相册</a>
            <a href="/stats" class="nav-link {% if request.path == '/stats' %}active{% endif %}">统计</a>
            <a href="/search" class="nav-link {% if request.path == '/search' %}active{% endif %}">搜索</a>
        </div>
    </div>
</nav>

<main class="main">
    {% block content %}{% endblock %}
</main>

<!-- Lightbox -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" class="lightbox-img" src="" alt="">
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeEditModal()">
    <div class="modal">
        <div class="modal-header">
            <h2>✏️ 编辑照片</h2>
            <span class="modal-x" onclick="closeEditModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div id="editPreview" class="edit-preview"></div>
            <form id="editForm" onsubmit="saveEdit(event)">
                <input type="hidden" id="editPath">
                <div class="form-group">
                    <label>回忆分 · <span id="editMemoryVal">50</span></label>
                    <input type="range" id="editMemory" min="0" max="100" value="50" oninput="editMemoryVal.textContent=this.value">
                </div>
                <div class="form-group">
                    <label>美观分 · <span id="editBeautyVal">50</span></label>
                    <input type="range" id="editBeauty" min="0" max="100" value="50" oninput="editBeautyVal.textContent=this.value">
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <select id="editType">
                        {% for t in ["人物/毕业","人物/孩子","人物/家庭","人物/情侣","人物/自拍","人物","猫咪","狗狗","宠物","旅行","风景","美食","日常","夜景","城市","植物","物体","文档","其他"] %}
                        <option value="{{ t }}">{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>旁白</label>
                    <input type="text" id="editSide" placeholder="一句旁白" maxlength="40">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>描述</label>
                        <textarea id="editCaption" rows="2" placeholder="照片描述"></textarea>
                    </div>
                    <div class="form-group">
                        <label>理由</label>
                        <input type="text" id="editReason" placeholder="简短理由">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-ghost" onclick="closeEditModal()">取消</button>
                </div>
                <div id="editResult" class="edit-result"></div>
            </form>
        </div>
    </div>
</div>

<script>
function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').style.display = 'flex';
}
function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
}
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { closeLightbox(); closeEditModal(); }
});

function openEditModal(path) {
    document.getElementById('editPath').value = path;
    document.getElementById('editResult').textContent = '';
    var img = document.getElementById('editPreview');
    var cleanPath = path.replace(/^\//, '');
    img.innerHTML = '<img src="/photo/' + encodeURI(cleanPath) + '" style="max-width:100%;max-height:200px;border-radius:10px;object-fit:cover">';

    fetch('/api/photo/detail?path=' + encodeURIComponent(path))
        .then(r => r.json())
        .then(d => {
            if (d.error) { alert(d.error); return; }
            document.getElementById('editMemory').value = d.memory_score || 50;
            document.getElementById('editMemoryVal').textContent = d.memory_score || 50;
            document.getElementById('editBeauty').value = d.beauty_score || 50;
            document.getElementById('editBeautyVal').textContent = d.beauty_score || 50;
            document.getElementById('editType').value = d.type || '日常';
            document.getElementById('editSide').value = d.side_caption || '';
            document.getElementById('editCaption').value = d.caption || '';
            document.getElementById('editReason').value = d.reason || '';
        });
    document.getElementById('editModal').style.display = 'block';
}
function closeEditModal() {
    document.getElementById('editModal').style.display = 'none';
}
function saveEdit(e) {
    e.preventDefault();
    var data = {
        path: document.getElementById('editPath').value,
        memory_score: parseFloat(document.getElementById('editMemory').value),
        beauty_score: parseFloat(document.getElementById('editBeauty').value),
        type: document.getElementById('editType').value,
        side_caption: document.getElementById('editSide').value,
        caption: document.getElementById('editCaption').value,
        reason: document.getElementById('editReason').value,
    };
    fetch('/api/photo/update', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
    })
    .then(r => r.json())
    .then(result => {
        var el = document.getElementById('editResult');
        if (result.error) {
            el.innerHTML = '❌ ' + result.error;
            el.className = 'edit-result error';
        } else {
            el.innerHTML = '✅ 已保存';
            el.className = 'edit-result success';
            el.style.display = 'block';
            setTimeout(function(){ location.reload(); }, 800);
        }
    });
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
