<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}InkMoments{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="nav">
    <div class="nav-inner">
        <a href="/" class="nav-logo">📷 <span>InkMoments</span></a>
        <div class="nav-links">
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">今日</a>
            <a href="/gallery" class="nav-link {% if request.path == '/gallery' %}active{% endif %}">相册</a>
            <a href="/stats" class="nav-link {% if request.path == '/stats' %}active{% endif %}">统计</a>
            <a href="/search" class="nav-link {% if request.path == '/search' %}active{% endif %}">搜索</a>
        </div>
    </div>
</nav>

<main class="main">
    {% block content %}{% endblock %}
</main>

<!-- Lightbox -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" class="lightbox-img" src="" alt="">
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeEditModal()">
    <div class="modal">
        <div class="modal-header">
            <h2>✏️ 编辑照片</h2>
            <span class="modal-x" onclick="closeEditModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div id="editPreview" class="edit-preview"></div>
            <form id="editForm" onsubmit="saveEdit(event)">
                <input type="hidden" id="editPath">
                <div class="form-group">
                    <label>回忆分 · <span id="editMemoryVal">50</span></label>
                    <input type="range" id="editMemory" min="0" max="100" value="50" oninput="editMemoryVal.textContent=this.value">
                </div>
                <div class="form-group">
                    <label>美观分 · <span id="editBeautyVal">50</span></label>
                    <input type="range" id="editBeauty" min="0" max="100" value="50" oninput="editBeautyVal.textContent=this.value">
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <select id="editType">
                        {% for t in ["人物/毕业","人物/孩子","人物/家庭","人物/情侣","人物/自拍","人物","猫咪","狗狗","宠物","旅行","风景","美食","日常","夜景","城市","植物","物体","文档","其他"] %}
                        <option value="{{ t }}">{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>旁白</label>
                    <input type="text" id="editSide" placeholder="一句旁白" maxlength="40">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>描述</label>
                        <textarea id="editCaption" rows="2" placeholder="照片描述"></textarea>
                    </div>
                    <div class="form-group">
                        <label>理由</label>
                        <input type="text" id="editReason" placeholder="简短理由">
                    </div>
                </div>
                <div class="form-group">
                    <label>标签</label>
                    <div class="tag-selector" id="tagSelector">
                        <div class="selected-tags" id="selectedTags" aria-live="polite" aria-atomic="false"></div>
                        <div class="tag-input-wrap" id="tagInputWrap">
                            <input type="text"
                                   id="editTagInput"
                                   class="tag-selector-input"
                                   placeholder="请选择或输入标签"
                                   autocomplete="off"
                                   role="combobox"
                                   aria-haspopup="listbox"
                                   aria-expanded="false"
                                   aria-controls="tagDropdown"
                                   aria-autocomplete="list">
                            <span class="tag-selector-arrow" aria-hidden="true">&#9662;</span>
                            <div class="tag-dropdown" id="tagDropdown" role="listbox" aria-label="标签选项"></div>
                        </div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-ghost" onclick="closeEditModal()">取消</button>
                </div>
                <div id="editResult" class="edit-result"></div>
            </form>
        </div>
    </div>
</div>

<script>
function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').style.display = 'flex';
}
function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
}
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { closeLightbox(); closeEditModal(); }
});

var currentTags = [];
var allTags = [];
var tagActiveIndex = -1;

function renderSelectedTags() {
    var container = document.getElementById('selectedTags');
    var input = document.getElementById('editTagInput');
    container.innerHTML = '';
    if (!currentTags.length) {
        container.style.display = 'none';
    } else {
        container.style.display = 'flex';
        currentTags.forEach(function(tag, idx) {
            var span = document.createElement('span');
            span.className = 'selected-tag';
            span.innerHTML = '<span class="text">' + tag + '</span><span class="remove" data-idx="' + idx + '" title="删除">&times;</span>';
            container.appendChild(span);
        });
    }
    container.querySelectorAll('.remove').forEach(function(btn) {
        btn.onclick = function(e) {
            e.stopPropagation();
            currentTags.splice(parseInt(this.dataset.idx), 1);
            renderSelectedTags();
            renderTagDropdown(document.getElementById('editTagInput').value);
            input.focus();
        };
    });
}

function renderTagDropdown(filter, show) {
    var dropdown = document.getElementById('tagDropdown');
    var input = document.getElementById('editTagInput');
    dropdown.innerHTML = '';
    tagActiveIndex = -1;
    var val = (filter || '').trim();
    var shouldShow = show !== false;

    // 未命中时提供「新建标签」选项
    if (val && currentTags.indexOf(val) === -1) {
        var createItem = document.createElement('div');
        createItem.className = 'tag-dropdown-item create';
        createItem.setAttribute('role', 'option');
        createItem.setAttribute('aria-selected', 'false');
        createItem.textContent = allTags.indexOf(val) === -1 ? '新建标签：' + val : '选择标签：' + val;
        createItem.onmousedown = function(e) { e.preventDefault(); };
        createItem.onclick = function() { addTag(val); };
        dropdown.appendChild(createItem);
    }

    // 展示所有已有标签，已选中的置灰并可再次点击取消
    var matched = allTags.filter(function(t) {
        return !val || t.indexOf(val) !== -1;
    });
    matched.forEach(function(tag) {
        var item = document.createElement('div');
        var isSelected = currentTags.indexOf(tag) !== -1;
        item.className = 'tag-dropdown-item' + (isSelected ? ' selected' : '');
        item.setAttribute('role', 'option');
        item.setAttribute('aria-selected', isSelected ? 'true' : 'false');
        item.innerHTML = '<span class="check">' + (isSelected ? '✓' : '') + '</span><span class="label">' + tag + '</span>';
        item.onmousedown = function(e) { e.preventDefault(); };
        item.onclick = function() {
            if (isSelected) removeTag(tag);
            else addTag(tag);
        };
        dropdown.appendChild(item);
    });

    if (!dropdown.children.length) {
        var empty = document.createElement('div');
        empty.className = 'tag-dropdown-empty';
        empty.textContent = '输入文字创建新标签';
        dropdown.appendChild(empty);
    }

    if (shouldShow) {
        input.setAttribute('aria-expanded', 'true');
        positionDropdown();
    } else {
        dropdown.style.display = 'none';
        input.setAttribute('aria-expanded', 'false');
    }
}

function addTag(tag) {
    tag = tag.trim();
    if (!tag || currentTags.indexOf(tag) !== -1) return;
    currentTags.push(tag);
    document.getElementById('editTagInput').value = '';
    renderSelectedTags();
    renderTagDropdown('');
    document.getElementById('editTagInput').focus();
}

function removeTag(tag) {
    var idx = currentTags.indexOf(tag);
    if (idx !== -1) currentTags.splice(idx, 1);
    renderSelectedTags();
    renderTagDropdown(document.getElementById('editTagInput').value);
    document.getElementById('editTagInput').focus();
}

function setActiveTagItem(index) {
    var items = document.querySelectorAll('#tagDropdown .tag-dropdown-item');
    items.forEach(function(item, i) {
        item.classList.toggle('active', i === index);
    });
    tagActiveIndex = index;
    if (index >= 0 && items[index]) {
        items[index].scrollIntoView({ block: 'nearest' });
    }
}

function positionDropdown() {
    var dropdown = document.getElementById('tagDropdown');
    var wrap = document.getElementById('tagInputWrap');
    if (!dropdown || !wrap) return;

    // 先按默认下方展开测量
    dropdown.style.top = '100%';
    dropdown.style.bottom = 'auto';
    dropdown.style.marginTop = '4px';
    dropdown.style.marginBottom = '0';
    dropdown.style.display = 'block';

    var wrapRect = wrap.getBoundingClientRect();
    var dropdownHeight = Math.min(dropdown.scrollHeight || 220, 220);
    var spaceBelow = window.innerHeight - wrapRect.bottom - 8;
    var spaceAbove = wrapRect.top - 8;

    // 如果下方空间不足且上方空间更充足，则向上展开
    if (spaceBelow < dropdownHeight && spaceAbove > spaceBelow) {
        dropdown.style.top = 'auto';
        dropdown.style.bottom = '100%';
        dropdown.style.marginTop = '0';
        dropdown.style.marginBottom = '4px';
    }
}

function openEditModal(path) {
    document.getElementById('editPath').value = path;
    document.getElementById('editResult').textContent = '';
    currentTags = [];
    allTags = [];
    document.getElementById('editTagInput').value = '';
    renderSelectedTags();
    // 弹窗打开时不自动展开标签下拉框，仅预渲染选项
    renderTagDropdown('', false);
    var img = document.getElementById('editPreview');
    var cleanPath = path.replace(/^\//, '');
    img.innerHTML = '<img src="/photo/' + encodeURI(cleanPath) + '" style="max-width:100%;max-height:200px;border-radius:10px;object-fit:cover">';

    Promise.all([
        fetch('/api/photo/detail?path=' + encodeURIComponent(path)).then(r => r.json()),
        fetch('/api/tags').then(r => r.json())
    ]).then(function(results) {
        var d = results[0];
        allTags = results[1] || [];
        // 数据加载后仍保持下拉框收起，等待用户点击输入框
        renderTagDropdown('', false);
        if (d.error) { alert(d.error); return; }
        document.getElementById('editMemory').value = d.memory_score || 50;
        document.getElementById('editMemoryVal').textContent = d.memory_score || 50;
        document.getElementById('editBeauty').value = d.beauty_score || 50;
        document.getElementById('editBeautyVal').textContent = d.beauty_score || 50;
        document.getElementById('editType').value = d.type || '日常';
        document.getElementById('editSide').value = d.side_caption || '';
        document.getElementById('editCaption').value = d.caption || '';
        document.getElementById('editReason').value = d.reason || '';
        try { currentTags = (JSON.parse(d.tags || '[]') || []); } catch(e) { currentTags = []; }
        renderSelectedTags();
        renderTagDropdown('', false);
    });
    document.getElementById('editModal').style.display = 'block';
}
function closeEditModal() {
    document.getElementById('editModal').style.display = 'none';
}

// 标签输入事件绑定
document.addEventListener('DOMContentLoaded', function() {
    var input = document.getElementById('editTagInput');
    var dropdown = document.getElementById('tagDropdown');
    var wrap = document.getElementById('tagInputWrap');
    var overlay = document.getElementById('editModal');
    if (!input) return;

    input.addEventListener('input', function() {
        renderTagDropdown(this.value);
    });

    input.addEventListener('keydown', function(e) {
        var items = document.querySelectorAll('#tagDropdown .tag-dropdown-item');
        if (e.key === 'Enter') {
            e.preventDefault();
            if (tagActiveIndex >= 0 && items[tagActiveIndex]) {
                items[tagActiveIndex].click();
            } else {
                addTag(this.value);
            }
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (tagActiveIndex < items.length - 1) setActiveTagItem(tagActiveIndex + 1);
            else setActiveTagItem(0);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (tagActiveIndex > 0) setActiveTagItem(tagActiveIndex - 1);
            else setActiveTagItem(items.length - 1);
        } else if (e.key === 'Backspace' && !this.value && currentTags.length) {
            e.preventDefault();
            currentTags.pop();
            renderSelectedTags();
            renderTagDropdown(this.value);
        } else if (e.key === 'Escape') {
            dropdown.style.display = 'none';
            input.blur();
        }
    });

    input.addEventListener('focus', function() {
        if (wrap) wrap.classList.add('focused');
        renderTagDropdown(this.value);
    });

    // 失焦时延迟关闭下拉框，避免点击选项时已被隐藏
    input.addEventListener('blur', function() {
        if (wrap) wrap.classList.remove('focused');
        setTimeout(function() {
            dropdown.style.display = 'none';
            input.setAttribute('aria-expanded', 'false');
        }, 150);
    });

    // 点击下拉框外部时关闭
    document.addEventListener('click', function(e) {
        var selector = document.getElementById('tagSelector');
        if (selector && !selector.contains(e.target)) {
            dropdown.style.display = 'none';
            input.setAttribute('aria-expanded', 'false');
        }
    });

    // 弹窗滚动或窗口大小变化时重新定位下拉框
    if (overlay) {
        overlay.addEventListener('scroll', function() {
            if (dropdown.style.display === 'block') positionDropdown();
        }, true);
    }
    window.addEventListener('resize', function() {
        if (dropdown.style.display === 'block') positionDropdown();
    });
});

function saveEdit(e) {
    e.preventDefault();
    var data = {
        path: document.getElementById('editPath').value,
        memory_score: parseFloat(document.getElementById('editMemory').value),
        beauty_score: parseFloat(document.getElementById('editBeauty').value),
        type: document.getElementById('editType').value,
        side_caption: document.getElementById('editSide').value,
        caption: document.getElementById('editCaption').value,
        reason: document.getElementById('editReason').value,
        tags: currentTags,
    };
    fetch('/api/photo/update', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
    })
    .then(r => r.json())
    .then(result => {
        var el = document.getElementById('editResult');
        if (result.error) {
            el.innerHTML = '❌ ' + result.error;
            el.className = 'edit-result error';
        } else {
            el.innerHTML = '✅ 已保存';
            el.className = 'edit-result success';
            el.style.display = 'block';
            setTimeout(function(){ location.reload(); }, 800);
        }
    });
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
